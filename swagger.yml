openapi: 3.0.3
info:
  title: Weather Station HTTP API
  version: 1.0.0
  description: 'OpenAPI description for the currently implemented AWS HTTP API.


    The ingest lambda accepts only `POST /observations`.

    The read lambda serves `GET /observations/latest` and `GET /observations`.

    '
servers:
- url: /
tags:
- name: ingest
- name: read
paths:
  /observations:
    post:
      tags:
      - ingest
      summary: Ingest a weather observation
      description: 'Creates a history observation row whose sort key starts with normalized

        `source_ts_utc` and is suffixed with normalized `received_at_utc` and

        `msg_id`. Exact retries dedupe, while distinct packets that repeat a

        source timestamp remain separate history items.


        `source_clock_skew_seconds` is `received_at_utc - source_ts_utc`.

        `source_time_suspect` is true when the absolute skew exceeds 600 seconds,

        or when source time rolls back behind the current `LATEST` while receiver

        time moves forward (or equal receiver times are ordered by a newer

        ingestion time). `display_ts_utc` uses receiver time when suspect and

        source time otherwise.


        `LATEST` advances primarily by normalized `received_at_utc`. For distinct

        writes with the same receiver timestamp, `ingested_at_utc` is the

        tie-breaker. Source time does not control live/latest freshness.


        Authentication is handled with the `x-weatherstation-key` header.

        '
      security:
      - WeatherStationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestObservationRequest'
      responses:
        '200':
          description: Observation accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              examples:
                accepted:
                  value:
                    ok: true
                    deduped: false
                    source_node_id: garden-node-01
                    msg_id: 1742666412
                    source_ts_utc: '2026-03-18T00:45:46.982324Z'
                    source_time_suspect: false
                    source_clock_skew_seconds: 1.017676
                    observation_sk: OBS#2026-03-18T00:45:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:45:48.000000Z#MSG#1742666412
                deduped:
                  value:
                    ok: true
                    deduped: true
                    source_node_id: garden-node-01
                    msg_id: 1742666412
                    source_ts_utc: '2026-03-18T00:45:46.982324Z'
                    source_time_suspect: false
                    source_clock_skew_seconds: 1.017676
                    observation_sk: OBS#2026-03-18T00:45:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:45:48.000000Z#MSG#1742666412
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidJson:
                  value:
                    ok: false
                    error: invalid_json
                validationFailed:
                  value:
                    ok: false
                    error: validation_failed
                    details:
                    - payload.source_node_id is required and must be a string
                    - payload.received_at_utc must include timezone information
        '401':
          description: Missing or invalid shared secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: unauthorized
    get:
      tags:
      - read
      summary: Get observation history
      description: 'Returns either a raw paged history window or an evenly sampled
        result set.


        Timezone-aware ISO-8601 or epoch `from` and `to` values are normalized to

        same fixed-width UTC format as the display-time history index. Ranges

        use `display_ts_utc`: receiver time when the source clock is suspect,

        source time otherwise. Existing primary keys and source timestamps

        remain unchanged. Legacy and newer observations are indexed by the

        backfill described in docs/operations/history_display_time_index.md.


        With view=chart, select bounded raw detail or UTC hour/day/month/year aggregates
        automatically. Summary statistics cover every matched observation; unavailable
        history remains empty. See docs/operations/aggregate_history.md.

        '
      parameters:
      - $ref: '#/components/parameters/StationId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Order'
      - $ref: '#/components/parameters/NextToken'
      - $ref: '#/components/parameters/Sample'
      - name: view
        in: query
        schema:
          type: string
          enum:
          - chart
        description: Opt into bounded aggregate history; omission retains the existing
          contract.
      - name: maxPoints
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 800
      responses:
        '200':
          description: Raw or sampled history response.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/RawHistoryResponse'
                - $ref: '#/components/schemas/SampledHistoryResponse'
                - $ref: '#/components/schemas/ChartHistoryResponse'
              examples:
                raw:
                  value:
                    ok: true
                    mode: raw
                    stationId: garden-node-01
                    from: '2026-03-18T00:00:00.000000Z'
                    to: '2026-03-18T23:59:59.999999Z'
                    order: desc
                    count: 1
                    items:
                    - pk: STATION#garden-node-01
                      sk: OBS#2026-03-18T00:46:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:46:48.000000Z#MSG#1742666472
                      record_type: observation
                      observation_type: WEATHER
                      source_node_id: garden-node-01
                      source_name: garden-node
                      msg_id: 1742666472
                      source_ts_utc: '2026-03-18T00:46:46.982324Z'
                      source_ts_raw: '2026-03-18T00:46:46.982324Z'
                      source_ts_sort_utc: '2026-03-18T00:46:46.982324Z'
                      received_at_utc: '2026-03-18T00:46:48.000000Z'
                      ingested_at_utc: '2026-03-18T00:46:48.231456Z'
                      display_ts_utc: '2026-03-18T00:46:46.982324Z'
                      source_time_suspect: false
                      source_clock_skew_seconds: 1.017676
                      weather:
                        air_temp_c: 14.8
                        relative_humidity_pct: 61
                        station_pressure_hpa: 1012.6
                      raw_payload:
                        payload:
                          source_node_id: garden-node-01
                          source_name: garden-node
                          msg_id: 1742666472
                          source_ts_utc: '2026-03-18T00:46:46.982324Z'
                          received_at_utc: '2026-03-18T00:46:48.000000Z'
                          weather:
                            air_temp_c: 14.8
                            relative_humidity_pct: 61
                            station_pressure_hpa: 1012.6
                sampled:
                  value:
                    ok: true
                    mode: sampled
                    stationId: garden-node-01
                    from: '2026-03-18T00:00:00.000000Z'
                    to: '2026-03-18T23:59:59.999999Z'
                    sampleRequested: 1
                    totalMatched: 1440
                    count: 1
                    items:
                    - pk: STATION#garden-node-01
                      sk: OBS#2026-03-18T00:00:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:00:48.000000Z#MSG#1742664046
                      record_type: observation
                      observation_type: WEATHER
                      source_node_id: garden-node-01
                      source_name: garden-node
                      msg_id: 1742664046
                      source_ts_utc: '2026-03-18T00:00:46.982324Z'
                      source_ts_sort_utc: '2026-03-18T00:00:46.982324Z'
                      received_at_utc: '2026-03-18T00:00:48.000000Z'
                      ingested_at_utc: '2026-03-18T00:00:48.231456Z'
                      display_ts_utc: '2026-03-18T00:00:46.982324Z'
                      source_time_suspect: false
                      source_clock_skew_seconds: 1.017676
                      weather:
                        air_temp_c: 14.1
        '400':
          description: Missing parameters or invalid paging or sampling request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingRequired:
                  value:
                    ok: false
                    error: missing_stationId_from_to
                invalidLimit:
                  value:
                    ok: false
                    error: limit_must_be_at_most_1000
                invalidNextToken:
                  value:
                    ok: false
                    error: invalid_nextToken
        '503':
          description: Aggregate history not ready, read budget exhausted, or temporary
            service failure.
  /observations/latest:
    get:
      tags:
      - read
      summary: Get the latest observation for a station
      description: 'Returns the newest accepted packet by normalized receiver time,
        with

        ingestion time breaking ties between distinct writes. Clients should use

        `display_ts_utc`, `received_at_utc`, or `ingested_at_utc` for live

        freshness instead of treating a suspect `source_ts_utc` as offline.

        '
      parameters:
      - $ref: '#/components/parameters/StationId'
      responses:
        '200':
          description: Latest observation item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestResponse'
              example:
                ok: true
                item:
                  pk: STATION#garden-node-01
                  sk: LATEST
                  record_type: latest
                  observation_type: WEATHER
                  source_node_id: garden-node-01
                  source_name: garden-node
                  msg_id: 1742666472
                  source_ts_utc: '2026-03-18T00:46:46.982324Z'
                  source_ts_raw: '2026-03-18T00:46:46.982324Z'
                  source_ts_sort_utc: '2026-03-18T00:46:46.982324Z'
                  received_at_utc: '2026-03-18T00:46:48.000000Z'
                  ingested_at_utc: '2026-03-18T00:46:48.231456Z'
                  display_ts_utc: '2026-03-18T00:46:46.982324Z'
                  source_time_suspect: false
                  source_clock_skew_seconds: 1.017676
                  weather:
                    air_temp_c: 14.8
                    relative_humidity_pct: 61
                    station_pressure_hpa: 1012.6
                  latest_observation_sk: OBS#2026-03-18T00:46:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:46:48.000000Z#MSG#1742666472
                  updated_at_utc: '2026-03-18T00:46:48.231456Z'
        '400':
          description: Missing station identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: missing_stationId
        '404':
          description: No latest row exists for the requested station.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: not_found
  /observations/exports:
    post:
      tags:
      - read
      summary: Queue a full raw CSV export (UTC and SI units)
      security:
      - WeatherStationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stationId
              - from
              - to
              properties:
                stationId:
                  type: string
                from:
                  type: string
                to:
                  type: string
      responses:
        '202':
          description: Queued or existing active job.
        '400':
          description: Invalid window.
        '401':
          description: Missing or invalid key.
        '404':
          description: Station not found.
        '429':
          description: Another station export is active.
        '503':
          description: Temporary queue failure.
  /observations/exports/{jobId}:
    parameters:
    - name: jobId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - read
      summary: Get CSV export progress or a temporary download link
      security:
      - WeatherStationKey: []
      responses:
        '200':
          description: Job status with rowsExported; ready jobs have downloadUrl and
            fileName.
        '401':
          description: Missing or invalid key.
        '404':
          description: Job not found.
        '410':
          description: Job expired.
    delete:
      tags:
      - read
      summary: Cancel a queued or running CSV export
      security:
      - WeatherStationKey: []
      responses:
        '200':
          description: Job status with rowsExported; ready jobs have downloadUrl and
            fileName.
        '401':
          description: Missing or invalid key.
        '404':
          description: Job not found.
        '410':
          description: Job expired.
components:
  securitySchemes:
    WeatherStationKey:
      type: apiKey
      in: header
      name: x-weatherstation-key
      description: Shared secret required by `POST /observations`.
  parameters:
    StationId:
      name: stationId
      in: query
      required: true
      description: Station or node identifier used to build `pk = STATION#<stationId>`.
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      description: 'Inclusive lower display-time bound for the observation range.
        Valid

        Timezone-aware ISO-8601 or epoch values are normalized before building

        `DISPLAY#<from>` in ObservationDisplayTimeIndex.

        '
      schema:
        type: string
        example: '2026-03-18T00:00:00.000000Z'
    To:
      name: to
      in: query
      required: true
      description: 'Inclusive upper display-time bound for the observation range.
        Valid

        Timezone-aware ISO-8601 or epoch values are normalized before building

        `DISPLAY#<to>~` in ObservationDisplayTimeIndex.

        '
      schema:
        type: string
        example: '2026-03-18T23:59:59.999999Z'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of raw history items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Order:
      name: order
      in: query
      required: false
      description: Use `asc` for ascending results. Any other value behaves as descending.
      schema:
        type: string
        default: desc
        example: desc
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Base64url-encoded DynamoDB `LastEvaluatedKey` from a prior raw
        history response.
      schema:
        type: string
    Sample:
      name: sample
      in: query
      required: false
      description: 'When provided, the API scans the full range in ascending order
        and

        returns an evenly sampled result set instead of paged raw history.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 2000
  schemas:
    TimestampInput:
      oneOf:
      - type: string
        description: ISO-8601 timestamp with timezone, or a numeric epoch encoded
          as a string.
        example: '2026-03-18T00:45:46.982324Z'
      - type: number
        description: Epoch timestamp in seconds, milliseconds, or microseconds.
        example: 1742268346.982324
    MsgIdInput:
      oneOf:
      - type: integer
        example: 1742666412
      - type: string
        pattern: ^-?\d+$
        example: '1742666412'
    WeatherFields:
      type: object
      description: 'Weather object accepted by ingest. Known fields are range-validated.

        Unknown fields are currently preserved and stored as provided.

        '
      properties:
        timestamp:
          $ref: '#/components/schemas/TimestampInput'
        wind_lull_ms:
          type: number
          minimum: 0
          maximum: 150
        wind_avg_ms:
          type: number
          minimum: 0
          maximum: 150
        wind_gust_ms:
          type: number
          minimum: 0
          maximum: 200
        wind_dir_deg:
          type: number
          minimum: 0
          maximum: 360
        wind_sample_interval_s:
          type: number
          minimum: 0
          maximum: 3600
        station_pressure_hpa:
          type: number
          minimum: 800
          maximum: 1200
        air_temp_c:
          type: number
          minimum: -100
          maximum: 100
        relative_humidity_pct:
          type: number
          minimum: 0
          maximum: 100
        illuminance_lux:
          type: number
          minimum: 0
          maximum: 500000
        uv_index:
          type: number
          minimum: 0
          maximum: 30
        solar_radiation_wm2:
          type: number
          minimum: 0
          maximum: 2000
        rain_interval_mm:
          type: number
          minimum: 0
          maximum: 1000
        precipitation_type:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
        lightning_avg_distance_km:
          type: number
          minimum: 0
          maximum: 1000
        lightning_strike_count:
          type: number
          minimum: 0
          maximum: 1000000
        battery_voltage_v:
          type: number
          minimum: 0
          maximum: 20
        report_interval_min:
          type: number
          minimum: 0
          maximum: 1440
        local_day_rain_mm:
          type: number
          minimum: 0
          maximum: 5000
        nearcast_rain_mm:
          type: number
          minimum: 0
          maximum: 5000
        local_day_nearcast_rain_mm:
          type: number
          minimum: 0
          maximum: 5000
        precipitation_analysis_type:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
      additionalProperties: true
    ObservationPayload:
      type: object
      required:
      - source_node_id
      - msg_id
      - source_ts_utc
      - received_at_utc
      - weather
      properties:
        source_node_id:
          type: string
          example: garden-node-01
        source_name:
          type: string
          example: garden-node
        msg_id:
          $ref: '#/components/schemas/MsgIdInput'
        source_ts_utc:
          $ref: '#/components/schemas/TimestampInput'
        received_at_utc:
          $ref: '#/components/schemas/TimestampInput'
        weather:
          $ref: '#/components/schemas/WeatherFields'
      additionalProperties: true
    IngestObservationRequest:
      type: object
      required:
      - payload
      properties:
        payload:
          $ref: '#/components/schemas/ObservationPayload'
    IngestResponse:
      type: object
      required:
      - ok
      - deduped
      - source_node_id
      - msg_id
      - source_ts_utc
      - source_time_suspect
      - source_clock_skew_seconds
      - observation_sk
      properties:
        ok:
          type: boolean
          enum:
          - true
        deduped:
          type: boolean
        source_node_id:
          type: string
        msg_id:
          type: integer
        source_ts_utc:
          type: string
          example: '2026-03-18T00:45:46.982324Z'
        source_time_suspect:
          type: boolean
          description: True when source time fails the skew or rollback checks.
        source_clock_skew_seconds:
          type: number
          description: Normalized `received_at_utc - source_ts_utc`, in seconds.
        observation_sk:
          type: string
          example: OBS#2026-03-18T00:45:46.982324Z#WEATHER#RECEIVED#2026-03-18T00:45:48.000000Z#MSG#1742666412
    ErrorResponse:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: string
    ValidationErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        required:
        - details
        properties:
          error:
            type: string
            enum:
            - validation_failed
          details:
            type: array
            items:
              type: string
    LatestItem:
      type: object
      required:
      - pk
      - sk
      - record_type
      - observation_type
      - source_node_id
      - msg_id
      - source_ts_utc
      - source_ts_sort_utc
      - received_at_utc
      - ingested_at_utc
      - display_ts_utc
      - source_time_suspect
      - source_clock_skew_seconds
      - weather
      - latest_observation_sk
      - updated_at_utc
      properties:
        pk:
          type: string
          example: STATION#garden-node-01
        sk:
          type: string
          example: LATEST
        record_type:
          type: string
          enum:
          - latest
        observation_type:
          type: string
          enum:
          - WEATHER
        source_node_id:
          type: string
        source_name:
          type: string
        msg_id:
          type: integer
        source_ts_utc:
          type: string
        source_ts_raw:
          oneOf:
          - type: string
          - type: number
        source_ts_sort_utc:
          type: string
        received_at_utc:
          type: string
          description: Normalized time at which the home receiver saw the packet.
        ingested_at_utc:
          type: string
          description: Time at which this latest snapshot candidate was ingested.
        display_ts_utc:
          type: string
          description: Receiver time when source time is suspect; otherwise source
            time.
        source_time_suspect:
          type: boolean
          description: 'True when absolute clock skew exceeds 600 seconds, or ingest
            detected

            source-time rollback while receiver time advanced, or while receiver

            time was equal and ingestion time advanced.

            '
        source_clock_skew_seconds:
          type: number
          description: Normalized `received_at_utc - source_ts_utc`, in seconds.
        weather:
          $ref: '#/components/schemas/WeatherFields'
        latest_observation_sk:
          type: string
        updated_at_utc:
          type: string
      additionalProperties: true
    HistoryObservationItem:
      type: object
      required:
      - pk
      - sk
      - record_type
      - observation_type
      - source_node_id
      - msg_id
      - source_ts_utc
      - source_ts_sort_utc
      - received_at_utc
      - display_ts_utc
      - source_time_suspect
      - source_clock_skew_seconds
      - weather
      - ingested_at_utc
      properties:
        pk:
          type: string
        sk:
          type: string
        record_type:
          type: string
          enum:
          - observation
        observation_type:
          type: string
          enum:
          - WEATHER
        source_node_id:
          type: string
        source_name:
          type: string
        msg_id:
          type: integer
        source_ts_utc:
          type: string
        source_ts_raw:
          oneOf:
          - type: string
          - type: number
        source_ts_sort_utc:
          type: string
        received_at_utc:
          type: string
          description: Normalized time at which the home receiver saw the packet.
        display_ts_utc:
          type: string
          description: Receiver time when source time is suspect; otherwise source
            time.
        source_time_suspect:
          type: boolean
          description: 'True when absolute clock skew exceeds 600 seconds, or ingest
            detected

            source-time rollback while receiver time advanced, or while receiver

            time was equal and ingestion time advanced.

            '
        source_clock_skew_seconds:
          type: number
          description: Normalized `received_at_utc - source_ts_utc`, in seconds.
        weather:
          $ref: '#/components/schemas/WeatherFields'
        raw_payload:
          type: object
          additionalProperties: true
        ingested_at_utc:
          type: string
      additionalProperties: true
    SampledObservationItem:
      type: object
      required:
      - pk
      - sk
      - record_type
      - observation_type
      - source_node_id
      - msg_id
      - source_ts_utc
      - source_ts_sort_utc
      - received_at_utc
      - ingested_at_utc
      - display_ts_utc
      - source_time_suspect
      - source_clock_skew_seconds
      - weather
      properties:
        pk:
          type: string
        sk:
          type: string
        record_type:
          type: string
          enum:
          - observation
        observation_type:
          type: string
          enum:
          - WEATHER
        source_node_id:
          type: string
        source_name:
          type: string
        msg_id:
          type: integer
        source_ts_utc:
          type: string
        source_ts_sort_utc:
          type: string
        received_at_utc:
          type: string
          description: Normalized time at which the home receiver saw the packet.
        ingested_at_utc:
          type: string
        display_ts_utc:
          type: string
          description: Receiver time when source time is suspect; otherwise source
            time.
        source_time_suspect:
          type: boolean
          description: 'True when absolute clock skew exceeds 600 seconds, or ingest
            detected

            source-time rollback while receiver time advanced, or while receiver

            time was equal and ingestion time advanced.

            '
        source_clock_skew_seconds:
          type: number
          description: Normalized `received_at_utc - source_ts_utc`, in seconds.
        weather:
